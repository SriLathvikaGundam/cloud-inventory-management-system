{% extends "base.html" %}
{% block title %}Inventory{% endblock %}

{% block content %}
<h1>Inventory</h1>

<div class="card">
    <h2>Add Inventory Record</h2>
    <form action="/ui/inventory/create" method="post">
        <label>Product</label>
        <select name="product_id" required>
            {% for product in products %}
            <option value="{{ product.id }}">{{ product.name }} ({{ product.sku }})</option>
            {% endfor %}
        </select>

        <label>Quantity</label>
        <input type="number" name="quantity" required>

        <label>Location</label>
        <input type="text" name="location">

        <button type="submit">Add Inventory</button>
    </form>
</div>

<table>
    <tr>
        <th>ID</th><th>Product</th><th>Quantity</th><th>Location</th><th></th>
    </tr>
    {% for item in inventory %}
    <tr>
        <td>{{ item.id }}</td>
        <td>{{ item.product.name }}</td>
        <td>{{ item.quantity }}</td>
        <td>{{ item.location or "-" }}</td>
        <td>
            <form action="/ui/inventory/{{ item.id }}/delete" method="post" style="margin:0;">
                <button type="submit" class="delete-btn">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
